# CI (docs/arch_mlops.md §8): en cada PR y en cada push a main. Sin AWS.
#   - Python: lint (ruff) + tests (pytest)
#   - Terraform: fmt + validate de las tres capas (sin backend)
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q tests

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"   # misma versión que en local

      - name: Formato
        run: terraform fmt -check -recursive infra mlflow_server/infra

      - name: Validación (shared, training, inference, mlflow_server)
        run: |
          for dir in infra/shared infra/training infra/inference mlflow_server/infra; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
