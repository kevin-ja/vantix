# Reentrenamiento (docs/arch_mlops.md §7): siempre manual. Actualiza y ejecuta el pipeline vantix-training con
# el código de main. Enciende el MLflow propio (EC2 de mlflow_server/, ~30 s) si está apagado (data_processing y
# model_training registran en él), espera a que termine y lo apaga, salvo que se pida dejarlo encendido para evaluar enseguida.
# Incluye todo el modelado: data_processing (features + metadata de los datos → MLflow) →
# model_training (preprocesador + KMeans por k + métricas → MLflow).
# Después: el especialista evalúa en MLflow contra el @benchmark (v1) y promueve con promote_best_model_manual.yml.
name: train_pipeline_manual

on:
  workflow_dispatch:
    inputs:
      ingest_date:
        description: "Partición de raw/ (ingest_date=…)"
        required: true
      snapshot_date:
        description: "Fecha de corte de las features (YYYY-MM-DD)"
        required: true
      window_days:
        description: "Ventana en días"
        default: "30"
      k_min:
        default: "2"
      k_max:
        default: "10"
      keep_mlflow_on:
        description: "Dejar MLflow encendido al terminar (~USD 0,03/h)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: train

defaults:
  run:
    shell: bash   # -eo pipefail: si el comando antes de `| tee` falla, el paso falla

jobs:
  train:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    env:
      AWS_REGION: us-east-1
      MLFLOW_INSTANCE_NAME: vantix-mlflow-server   # tag Name de la EC2 (el id cambia al reemplazarse)
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GH_TRAIN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Encender MLflow (si está apagado)
        id: mlflow
        run: |
          read -r id state < <(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$MLFLOW_INSTANCE_NAME" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[0].Instances[0].[InstanceId,State.Name]' --output text)
          echo "instance=$id" >> "$GITHUB_OUTPUT"
          if [ "$state" = "stopping" ]; then aws ec2 wait instance-stopped --instance-ids "$id"; state=stopped; fi
          if [ "$state" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$id" > /dev/null
            echo "started=true" >> "$GITHUB_OUTPUT"
          fi
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$MLFLOW_TRACKING_URI/health")" = 200 ] && exit 0
            sleep 5
          done
          echo "MLflow no respondió en $MLFLOW_TRACKING_URI"; exit 1

      - name: Upsert + ejecución de vantix-training
        id: run
        env:
          VANTIX_BUCKET: ${{ vars.DATA_BUCKET }}
          VANTIX_ROLE_ARN: ${{ vars.TRAINING_EXEC_ROLE_ARN }}
          VANTIX_MLFLOW_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          VANTIX_MLFLOW_PASSWORD_PARAM: ${{ vars.MLFLOW_PASSWORD_PARAM }}
          VANTIX_REGION: us-east-1
          SAGEMAKER_SUPPRESS_V2_WARNING: "1"
          INGEST_DATE: ${{ inputs.ingest_date }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
          WINDOW_DAYS: ${{ inputs.window_days }}
          K_MIN: ${{ inputs.k_min }}
          K_MAX: ${{ inputs.k_max }}
        run: |
          python -m pipelines.training.pipeline_sagemaker run --ingest-date "$INGEST_DATE" \
            --snapshot-date "$SNAPSHOT_DATE" --window-days "$WINDOW_DAYS" --k-min "$K_MIN" --k-max "$K_MAX" \
            | tee run.log
          arn=$(grep -o 'arn:aws:sagemaker:[^ ]*/execution/[^ ]*' run.log)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Esperar a que termine
        env:
          ARN: ${{ steps.run.outputs.arn }}
        run: |
          while true; do
            status=$(aws sagemaker describe-pipeline-execution --pipeline-execution-arn "$ARN" \
              --query PipelineExecutionStatus --output text)
            case "$status" in Executing|Stopping) sleep 60 ;; *) break ;; esac
          done
          aws sagemaker list-pipeline-execution-steps --pipeline-execution-arn "$ARN" \
            --query "PipelineExecutionSteps[].[StepName,StepStatus,StartTime,EndTime,FailureReason]" --output table \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Estado: $status — revisar el run en MLflow (experimento vantix-segmentation)" >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = "Succeeded" ]

      - name: Apagar MLflow (si lo encendió este workflow)
        if: always() && steps.mlflow.outputs.started == 'true' && !inputs.keep_mlflow_on
        run: aws ec2 stop-instances --instance-ids "${{ steps.mlflow.outputs.instance }}" > /dev/null
