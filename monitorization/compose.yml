# Sistema de monitorización (ver doc/monitorization_arch.md §8).
#   db       : PostgreSQL, siempre encendido. Datos en el volumen EBS (/data/postgres).
#   frontend : Grafana, siempre encendido. Dashboard + alertas por SES (SMTP), provisionados desde grafana/.
#              Datos (usuarios, estado de alertas) en /data/grafana.
#   backend  : job (perfil "job"): no arranca con `up`; se ejecuta con `docker compose run --rm backend <job>`.
# Variables: las escribe el arranque de la EC2 (infra/user_data.sh.tftpl) en .env.
# Credenciales de AWS: las del rol de la EC2 (IMDSv2), nunca llaves en archivos.

services:
  db:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATA: /var/lib/postgresql/data/pgdata   # subcarpeta: la raíz del volumen tiene lost+found
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      # Esquema al inicializar un volumen vacío: las tablas existen antes de la primera corrida
      # (si no, las reglas de alerta de Grafana fallan hasta que corre un job).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    image: grafana/grafana-oss:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    depends_on:
      db: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?}
      # Detrás de CloudFront el Origin del navegador no coincide con el Host que recibe Grafana: sin esto,
      # toda consulta con sesión responde 403 "origin not allowed". Solo el dominio, sin esquema.
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: ${GRAFANA_DOMAIN:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:?}
      GF_SMTP_USER: ${SMTP_USER:?}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL:?}
      GF_SMTP_FROM_NAME: Vantix monitoring
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Interpolados en el provisioning (grafana/provisioning/): datasource y contact point.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      ALERT_EMAIL: ${ALERT_EMAIL:?}
    volumes:
      - /data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # datasource, dashboards, alertas (como código)
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?}
    profiles: [job]
    depends_on:
      db: { condition: service_healthy }
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:?}
      DATA_BUCKET: ${DATA_BUCKET:?}
      MONITORING_BUCKET: ${MONITORING_BUCKET:?}
      PGHOST: db
      PGDATABASE: monitoring
      PGUSER: monitoring
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    restart: "no"
