[mlflow]
# Usuarios y permisos en su propia base SQLite, también replicada a S3 por Litestream.
database_uri = sqlite:////data/basic_auth.db
default_permission = READ
admin_username = admin
# Sin contraseña aquí: se toma de MLFLOW_AUTH_ADMIN_PASSWORD la primera vez que arranca con la base vacía
# (en AWS viene de SSM Parameter Store). Después se ignora; para rotarla: API update-password.
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
